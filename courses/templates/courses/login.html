<!DOCTYPE html>
<html>
<head>
    <title>Login - LearnHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: whitesmoke;
        }

        .box {
            width: 400px;
            margin: 80px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 12px lightgray;
        }

        h1 {
            text-align: center;
            color: black;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        .login-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            text-align: center;
            color: red;
            font-weight: bold;
            margin-top: 15px;
        }

        .register {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Student Login</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <a href="/register/" class="register">
            Don't have an account? Register
        </a>

    </div>

</body>
</html>
