<!DOCTYPE html>
<html>
<head>
    <title>{{ course.title }} - LearnHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: whitesmoke;
        }

        .container {
            width: 70%;
            margin: 60px auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 12px lightgray;
        }

        h1 {
            color: black;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        .enroll-btn {
            display: inline-block;
            background-color: blue;
            color: white;
            padding: 12px 22px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: blue;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>{{ course.title }}</h1>

        <p class="description">
            {{ course.description }}
        </p>

        <p class="price">
            Rs. {{ course.price }}
        </p>

        <a href="/enroll/" class="enroll-btn">
            Enroll Now
        </a>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>
</html>
